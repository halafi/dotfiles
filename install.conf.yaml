- defaults:
    link:
      create: true
      relink: true
      
  # remove dead symlinks
- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true

- link:
    # home
    ~/:
      glob: true
      path: home/*
      prefix: "."
    ~/.config/bat/config: config/bat/config
    ~/.config/karabiner.edn: config/karabiner.edn
    ~/.config/fish:
      glob: true
      path: config/fish/*
